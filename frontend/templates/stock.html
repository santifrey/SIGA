<div class="fade-in">
  <!-- Encabezado simple -->
  <div class="d-flex justify-between align-center mb-4 flex-wrap gap-md">
    <div>
      <h1 style="font-size: 1.5rem; margin-bottom: 0.25rem;">Consulta de Stock de Bulbos</h1>
      <p class="text-muted text-sm">Disponibilidad actual por clase para la Sucursal o Cliente seleccionado</p>
    </div>
    <div>
      <button class="btn btn-secondary btn-sm" id="btn-refresh-stock">
        <svg class="icon-svg sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          style="margin-right: 0.25rem;">
          <polyline points="23 4 23 10 17 10"></polyline>
          <polyline points="1 20 1 14 7 14"></polyline>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
        </svg>
        <span>Actualizar</span>
      </button>
    </div>
  </div>

  <!-- Selector de Titular: overflow visible para desplegable de autocompletado -->
  <div class="card mb-4" style="padding: 1.25rem; overflow: visible; position: relative; z-index: 20;">
    <!-- Selector de Modo (Cliente vs Sucursal) -->
    <div class="d-flex align-center gap-md flex-wrap mb-3" id="modo-titular-container">
      <span class="text-sm font-semibold text-muted" style="min-width: 140px;">Consultar stock de:</span>
      <div class="d-flex gap-sm">
        <button type="button" class="btn btn-sm btn-primary" id="btn-modo-cliente">
          👤 Cliente / Productor
        </button>
        <button type="button" class="btn btn-sm btn-secondary" id="btn-modo-sucursal">
          🏢 Depósito de Sucursal
        </button>
      </div>
    </div>

    <!-- Opción A: Búsqueda Rápida de Cliente (DEFAULT) -->
    <div id="panel-cliente" style="position: relative; overflow: visible;">
      <div class="d-flex align-start gap-md flex-wrap">
        <label class="form-label font-semibold" style="margin-top: 0.5rem; min-width: 140px;">
          Buscar Cliente:
        </label>
        <div style="flex: 1; max-width: 540px; position: relative; overflow: visible;">
          <div id="stock-cliente-autocomplete" style="position: relative; overflow: visible;"></div>
        </div>
      </div>
    </div>

    <!-- Opción B: Desplegable de Sucursales -->
    <div id="panel-sucursal" class="d-flex align-center gap-md flex-wrap hidden">
      <label for="select-sucursal-stock" class="form-label font-semibold" style="margin: 0; min-width: 140px;">
        Sucursal:
      </label>
      <div style="flex: 1; max-width: 480px;">
        <select id="select-sucursal-stock" class="form-control">
          <option value="">Cargando sucursales...</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Tabla simple de Stock de 5 Clases -->
  <div class="table-card">
    <div class="table-responsive">
      <table class="table" id="stock-table">
        <thead>
          <tr>
            <th style="width: 15%;">Código</th>
            <th style="width: 45%;">Clasificación de Bulbo</th>
            <th style="width: 40%; text-align: right;">Cantidad Disponible (Unidades)</th>
          </tr>
        </thead>
        <tbody id="stock-table-body">
          <tr>
            <td colspan="3" class="text-center text-muted" style="padding: 2rem;">Cargando stock...</td>
          </tr>
        </tbody>
        <tfoot id="stock-table-foot" style="background: var(--surface-alt); font-weight: 700;">
          <tr>
            <td colspan="2" style="padding: 1rem; text-align: right;">TOTAL BULBOS DISPONIBLES:</td>
            <td id="stock-total-cell"
              style="padding: 1rem; text-align: right; color: var(--primary); font-size: 1.1rem;">0</td>
          </tr>
        </tfoot>
      </table>
    </div>
  </div>
</div>
